name: 打安卓离线包

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "style.css"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 环境自检
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          java -version

      - name: 装依赖并构建网页产物
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: 生成安卓工程
        run: |
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 用固定签名重签 APK
        run: |
          mkdir -p out
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 android/app/build/outputs/apk/debug/app-debug.apk out/eatwha-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks android-signing/eatwha.jks --ks-key-alias eatwha \
            --ks-pass pass:eatwha2026 --key-pass pass:eatwha2026 \
            --out out/eatwha.apk out/eatwha-aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs out/eatwha.apk | head -n 6
          ls -lh out/eatwha.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eatwha-apk
          path: out/eatwha.apk
          if-no-files-found: error

      - name: 覆盖旧版本 release（固定下载链接）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk out/eatwha.apk \
            --title "安卓安装包（最新）" \
            --notes "下载 eatwha.apk，传到安卓手机点开安装即可。离线可用，不需要联网。签名已固定，以后新版本可以直接覆盖安装；如果手机上装的是更早的测试版（签名不同），先卸载再装。" \
            --latest
